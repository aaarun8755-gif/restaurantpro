<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RestaurantPro | Cashier POS Terminal</title>
<script src="/socket.io/socket.io.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f4;color:#173b34}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:#115e59;color:#fff}
.wrap{max-width:1440px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.card{background:#fff;border:1px solid #dce6e1;border-radius:12px;padding:16px;margin-bottom:14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.mitem{border:1px solid #dce6e1;border-radius:8px;padding:10px;cursor:pointer;background:#fff;text-align:left}
.mitem:hover{border-color:#0f766e;background:#eef8f4}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf2ee;text-align:left;font-size:13px}
input,select{width:100%;padding:10px;border:1px solid #dce6e1;border-radius:7px;box-sizing:border-box;margin:5px 0 10px}
.btn{border:0;border-radius:7px;padding:10px 14px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer}
.btn.light{background:#fff;color:#0f766e;border:1px solid #dce6e1}.btn.danger{background:#fff0ee;color:#b42318}
.hidden{display:none!important}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
<style id="rpCambriaFont">
  *, body, input, select, textarea, button, table, th, td, h1, h2, h3, h4, p, span, div {
    font-family: Cambria, 'Times New Roman', Georgia, serif !important;
  }
</style>
<style id="rpSidebarSizeBoost">
  aside, nav, .side, #rpProdMgmtGroup, #rpLogiMgmtGroup, #rpMgmtSubMenu, #rpHoWebMenuBtn, #rpSwiggyNav, #rpZomatoNav, #rpWebNav {
    font-size: 14.5px !important;
  }
  aside *, nav *, .side *, #rpProdMgmtGroup *, #rpLogiMgmtGroup *, #rpMgmtSubMenu *, #rpHoWebMenuBtn *, #rpSwiggyNav *, #rpZomatoNav *, #rpWebNav * {
    font-size: 14.5px !important;
  }
</style>

<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fw3.org%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%230f766e%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2226%22%20fill%3D%22none%22%20stroke%3D%22%23fbbf24%22%20stroke-width%3D%223%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2241%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2226%22%20font-weight%3D%22bold%22%20fill%3D%22%23fef3c7%22%20text-anchor%3D%22middle%22%3ERP%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fw3.org%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%230f766e%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2226%22%20fill%3D%22none%22%20stroke%3D%22%23fbbf24%22%20stroke-width%3D%223%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2241%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2226%22%20font-weight%3D%22bold%22%20fill%3D%22%23fef3c7%22%20text-anchor%3D%22middle%22%3ERP%3C%2Ftext%3E%3C%2Fsvg%3E">
</head>
<body>
<header>
  <div><strong>✦ RestaurantPro | Cashier POS Terminal</strong><br><small id="psub">4-Digit PIN Login Required</small></div>
  <button id="plout" class="btn light hidden" onclick="localStorage.removeItem('rpPosOnly');location.reload()">Lock POS</button>
</header>
<div class="wrap" id="pLogin">
  <div class="card" style="max-width:380px;margin:40px auto">
    <h2 style="margin-top:0">POS Login (4-Digit PIN)</h2>
    <form id="plf">
      <input id="pp" type="tel" required placeholder="Mobile Number (e.g. 8755825082)">
      <input id="ppw" type="password" maxlength="4" pattern="\d{4}" required placeholder="4-Digit Password">
      <button class="btn" style="width:100%">Unlock POS Only →</button>
    </form>
    <p id="perr" style="color:#b42318;font-weight:700"></p>
  </div>
</div>
<div class="wrap hidden" id="pMain">
  <div class="grid">
    <div class="card">
      <h3 style="margin-top:0">Quick POS Billing</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="btype"><option>Dine In</option><option>Takeaway</option></select><input id="btbl" placeholder="Table No."></div>
      <div id="mgrid" class="mgrid"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Current Bill</h3><div id="cbox">Empty</div><hr>
      <select id="pmode"><option>Cash</option><option>UPI</option><option>Card</option></select>
      <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin:8px 0"><span>Total (+5% GST):</span><span id="btot">₹0.00</span></div>
      <button class="btn" id="gbtn" style="width:100%" disabled>Generate Bill &amp; KOT →</button>
    </div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">Live Outlet Orders</h3>
    <table><thead><tr><th>KOT / Order</th><th>Table / Source</th><th>Items</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody id="obody"></tbody></table>
  </div>
</div>
<script>
const socket = io();
let pu = JSON.parse(localStorage.getItem('rpPosOnly') || 'null'), menu = [], cart = {};
plf.onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/pos-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:pp.value,password:ppw.value})});
  const d = await r.json(); if(!r.ok){ perr.textContent = d.error; return; }
  pu = d; localStorage.setItem('rpPosOnly', JSON.stringify(pu)); openP();
};
async function openP() {
  pLogin.classList.add('hidden'); pMain.classList.remove('hidden'); plout.classList.remove('hidden');
  psub.textContent = `Cashier: ${pu.name} (${pu.phone}) · ${pu.outlet}`;
  menu = (await (await fetch('/api/menu?outlet='+encodeURIComponent(pu.outlet))).json()).filter(m=>m.available!==false);
  mgrid.innerHTML = menu.map(m => `<button class="mitem" onclick="addC('${m.id}')"><strong>${m.name}</strong><br><b style="color:#0f766e">₹${m.price}</b></button>`).join('');
  loadO();
}
function addC(id) { const it=menu.find(m=>String(m.id)===String(id)); if(!cart[id]) cart[id]={...it,qty:0}; cart[id].qty++; drawC(); }
function drawC() {
  const l = Object.values(cart); if(!l.length){ cbox.innerHTML='Empty'; btot.textContent='₹0.00'; gbtn.disabled=true; return; }
  const s = l.reduce((a,b)=>a+b.price*b.qty,0);
  cbox.innerHTML = l.map(i=>`<div style="display:flex;justify-content:space-between;padding:4px 0">${i.name} × ${i.qty} <b>₹${(i.price*i.qty).toFixed(2)}</b></div>`).join('');
  btot.textContent = '₹' + (s*1.05).toFixed(2); gbtn.disabled = false;
}
gbtn.onclick = async () => {
  await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'POS',waiterPhone:pu.name,outlet:pu.outlet,orderType:btype.value,tableName:btbl.value||btype.value,items:Object.values(cart).map(i=>({itemId:i.id,name:i.name,qty:i.qty,price:i.price})),paymentMethod:pmode.value})});
  cart = {}; btbl.value = ''; drawC(); loadO();
};
async function act(id, status) { await fetch('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}); loadO(); }
async function loadO() {
  if(!pu) return;
  const list = await (await fetch('/api/orders?outlet='+encodeURIComponent(pu.outlet))).json();
  obody.innerHTML = list.map(o => `<tr><td><b>${o.kotNo||o.orderNo}</b><br><small>${o.billNo||''}</small></td><td><b>${o.tableName}</b> (${o.source})</td><td>${(o.items||[]).map(i=>`${i.name}×${i.qty}`).join(', ')}</td><td><b>₹${Number(o.total).toFixed(2)}</b></td><td>${o.status}</td><td>${o.status==='Pending Approval'?`<button class="btn" onclick="act('${o.id}','Accepted')">Accept</button> <button class="btn danger" onclick="act('${o.id}','Rejected')">✕</button>`:o.paymentStatus||'Done'}</td></tr>`).join('');
}
socket.on('orders:changed', loadO); socket.on('orders:new_qr', loadO);
if(pu) openP();
</script>

<script id="rpForwardPosToKot">
  (function(){
    window._sentOrderIds = window._sentOrderIds || {};
    function syncLatestOrders() {
      ['rpOrders', 'rpBills'].forEach(key => {
        try {
          const arr = JSON.parse(localStorage.getItem(key) || '[]');
          if (!Array.isArray(arr) || !arr.length) return;
          const latest = arr;
          const oid = latest.id || latest.billNo || JSON.stringify(latest.items);
          if (oid && !window._sentOrderIds[oid]) {
            window._sentOrderIds[oid] = true;
            fetch('/api/orders', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                outlet: latest.outlet || localStorage.getItem('rpSelectedOutlet') || 'Main Outlet',
                table: latest.table || latest.tableNo || 'POS-Counter',
                orderType: latest.orderType || 'Dine-In',
                customerName: latest.customerName || 'Walk-in',
                items: latest.items || [],
                total: latest.total || 0,
                paymentMode: latest.paymentMode || 'Cash'
              })
            }).catch(()=>{});
          }
        } catch(_) {}
      });
    }
    setInterval(syncLatestOrders, 1500);
  })();
  </script>

<script id="rpQrApprovalSuite">
(function(){
  if (document.getElementById('rpQrBarBox')) return;
  const bar = document.createElement('div');
  bar.id = 'rpQrBarBox';
  bar.style.cssText = 'display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99999;background:#fffbeb;border:2px solid #f59e0b;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:10px 16px;border-radius:12px;font-family:Inter,Arial,sans-serif;font-size:13px;max-width:94vw';
  document.body.appendChild(bar);

  const modal = document.createElement('div');
  modal.id = 'rpQrViewModal';
  modal.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100000;align-items:center;justify-content:center';
  modal.innerHTML = '<div style="background:#fff;border-radius:14px;padding:18px;max-width:420px;width:92%;font-family:Inter,Arial,sans-serif"><h3 style="margin-top:0;color:#115e59">?? QR Order Details</h3><div id="rpQrModalBody" style="font-size:13px;line-height:1.6"></div><div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end" id="rpQrModalBtns"></div></div>';
  document.body.appendChild(modal);

  window._qrCache = {};
  async function pollQr() {
    try {
      const r = await fetch('/api/orders');
      if (!r.ok) return;
      const all = await r.json();
      const selOut = localStorage.getItem('rpSelectedOutlet') || '';
      const pend = all.filter(o => (o.source === 'QR' || o.status === 'Pending') && !['Accepted','Completed','Cancelled'].includes(o.status) && (!selOut || selOut === 'Head Office' || o.outlet === selOut));
      if (!pend.length) { bar.style.display = 'none'; return; }
      pend.forEach(o => window._qrCache[o.id] = o);
      bar.style.display = 'block';
      bar.innerHTML = '<strong style="color:#92400e">?? QR Order Approval Required (' + pend.length + '):</strong> ' +
        pend.map(o => '<span style="display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #fcd34d;padding:5px 10px;border-radius:8px;margin:3px">' +
          '<b>' + (o.tableName||'Table') + '</b> ? ' + (o.customerName||'Guest') + ' (' + (o.customerPhone||'-') + ') ? <b>?' + (o.total||0) + '</b> ' +
          '<button onclick="viewQrOrd(\'' + o.id + '\')" style="background:#e0f2fe;color:#0369a1;border:0;border-radius:6px;padding:4px 8px;cursor:pointer;font-weight:700">?? View</button>' +
          '<button onclick="actQrOrd(\'' + o.id + '\',\'approve\')" style="background:#0f766e;color:#fff;border:0;border-radius:6px;padding:4px 8px;cursor:pointer;font-weight:700">? Approve</button>' +
          '<button onclick="actQrOrd(\'' + o.id + '\',\'reject\')" style="background:#fee2e2;color:#b91c1c;border:0;border-radius:6px;padding:4px 8px;cursor:pointer;font-weight:700">? Reject</button>' +
        '</span>').join('');
    } catch(_) {}
  }

  window.viewQrOrd = function(id) {
    const o = window._qrCache[id]; if (!o) return;
    document.getElementById('rpQrModalBody').innerHTML =
      '<b>Outlet:</b> ' + (o.outlet||'-') + '<br><b>Table:</b> ' + (o.tableName||'-') +
      '<br><b>Customer:</b> ' + (o.customerName||'-') + ' (<b>?? ' + (o.customerPhone||'N/A') + '</b>)' +
      '<br><b>Payment:</b> ' + (o.paymentMode||'Cash') + (o.customerNote ? '<br><b>Note:</b> ' + o.customerNote : '') +
      '<hr style="border:0;border-top:1px solid #e2e8f0;margin:8px 0">' +
      (o.items||[]).map(i => '<div style="display:flex;justify-content:space-between"><span>' + i.name + ' ? ' + i.qty + '</span><b>?' + (i.price*i.qty) + '</b></div>').join('') +
      '<hr style="border:0;border-top:1px solid #e2e8f0;margin:8px 0"><div style="text-align:right;font-size:15px"><b>Total: ?' + (o.total||0) + '</b></div>';
    document.getElementById('rpQrModalBtns').innerHTML =
      '<button onclick="document.getElementById(\'rpQrViewModal\').style.display=\'none\'" style="padding:7px 12px;border:1px solid #cbd5e1;background:#fff;border-radius:7px;cursor:pointer">Close</button>' +
      '<button onclick="actQrOrd(\'' + id + '\',\'reject\')" style="padding:7px 12px;border:0;background:#fee2e2;color:#b91c1c;border-radius:7px;font-weight:700;cursor:pointer">? Reject</button>' +
      '<button onclick="actQrOrd(\'' + id + '\',\'approve\')" style="padding:7px 12px;border:0;background:#0f766e;color:#fff;border-radius:7px;font-weight:700;cursor:pointer">? Approve ? KDS &amp; Sale</button>';
    modal.style.display = 'flex';
  };

  window.actQrOrd = async function(id, type) {
    modal.style.display = 'none';
    const url = type === 'approve' ? '/api/orders/' + id + '/approve-qr' : '/api/orders/' + id + '/reject-qr';
    const r = await fetch(url, { method: 'POST' });
    if (r.ok && type === 'approve') {
      const data = await r.json(); const o = data.order;
      if (o) {
        const bills = JSON.parse(localStorage.getItem('rpBills') || '[]');
        bills.unshift({ billNo: 'QR-' + Date.now(), date: new Date().toISOString(), outlet: o.outlet, table: o.tableName, customerName: o.customerName, customerPhone: o.customerPhone, items: o.items, total: o.total, paymentMode: o.paymentMode || 'Cash', status: 'Paid' });
        localStorage.setItem('rpBills', JSON.stringify(bills));
      }
      alert('? Approved! Order sent to KDS & added to Sales.');
    } else if (r.ok) {
      alert('? QR Order Rejected (Not added to KDS or Sales).');
    }
    pollQr();
  };
  setInterval(pollQr, 2500);
  pollQr();
})();
</script>
</body>

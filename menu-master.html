<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Menu Master</title>
<style>*{box-sizing:border-box;font-family:Cambria,serif}body{margin:0;background:#f4f7f6}
header{background:#fff;border-bottom:1px solid #dbe5e2;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:1400px;margin:auto;padding:15px}.card{background:#fff;border:1px solid #dbe5e2;border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
input,select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px}
.btn{border:0;border-radius:8px;padding:8px 14px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:13px}
.btn.light{background:#fff;color:#0f766e;border:1px solid #cbd5e1}.btn.d{background:#fee2e2;color:#b91c1c}.btn.sm{padding:4px 8px;font-size:11.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{background:#eef6f4;padding:8px;text-align:left;border:1px solid #cbd5e1}td{border:1px solid #cbd5e1;padding:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center}
</style></head><body>
<header><div><strong style="font-size:18px;color:#115e59">Menu Master (4 Categories, Barcode & Self-Recipe)</strong> | <small id="outLbl"></small></div>
<div><button class="btn" onclick="openForm('ADD')">+ Add New Item</button> <a href="/index.html" class="btn light">&larr; Dashboard</a></div></header>
<div class="wrap"><div class="card" style="border-left:5px solid #d97706"><strong style="color:#b45309">Pending Approvals</strong>
<table><thead><tr><th>Req</th><th>Action</th><th>Item</th><th>4 Categories</th><th>Barcode</th><th>From</th><th>HO Action</th></tr></thead><tbody id="apBody"></tbody></table></div>
<div class="card"><strong style="color:#115e59">Approved Menu Items</strong>
<table><thead><tr><th>Name</th><th>Cat 1</th><th>Cat 2</th><th>Cat 3</th><th>Vendor</th><th>Code</th><th>Barcode</th><th>Price</th><th>Recipe</th><th>Actions</th></tr></thead><tbody id="menuBody"></tbody></table></div></div><div class="modal" id="fModal"><div style="background:#fff;border-radius:12px;padding:18px;width:95%;max-width:700px">
<div style="display:flex;justify-content:space-between;margin-bottom:10px"><strong id="fTitle">Add Menu Item</strong><button class="btn light sm" onclick="fModal.style.display='none'">Close</button></div>
<form id="mForm"><input type="hidden" id="eId"><input type="hidden" id="rAct" value="ADD">
<div class="fgrid">
<div><label>Name *</label><input id="fName" required oninput="autoBar()"></div>
<div><label>Price *</label><input id="fPrice" type="number" required></div>
<div><label>Short Code *</label><input id="fCode" required oninput="autoBar()"></div>
<div><label>Barcode (Auto) *</label><input id="fBar" required></div>
<div><label>1. Cat One *</label><select id="fC1"><option>Continental</option><option>South Indian</option><option>North Indian</option><option>Sweets</option><option selected>Retail</option></select></div>
<div><label>2. Cat Two *</label><select id="fC2"><option>Restaurant</option><option selected>Retail</option><option>Sweet</option><option>Bakery</option><option>Namkeen</option></select></div>
<div><label>3. Cat Three *</label><select id="fC3" onchange="togRec()"><option value="Self Creatable">Self Creatable</option><option value="Manual Creatable">Manual Creatable</option></select></div>
<div><label>4. Vendor *</label><select id="fVen"><option>Arun Traders Vendor</option><option>Brij Mohan Dairy</option><option>Tamanna Traders</option></select></div>
</div>
<div style="background:#f0fdf4;padding:10px;border-radius:8px;margin-top:10px">
<label><input type="checkbox" id="chkSelf" checked onchange="togRec()" style="width:auto"> <b>Create Self Item Recipe</b></label>
<select id="fUnit" style="width:120px;margin-left:10px"><option>1 Pc</option><option>1 Kg</option><option>1 Pkt</option></select>
</div>
<div style="text-align:right;margin-top:10px"><button class="btn">Submit for HO Approval &rarr;</button></div>
</form></div></div>
<div class="modal" id="hoModal"><div style="background:#fff;border-radius:12px;padding:18px;width:95%;max-width:580px">
<h3>Select Outlets for Access</h3><p id="hoInfo"></p>
<div id="hoGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:200px;overflow:auto"></div>
<div style="text-align:right;margin-top:10px"><button class="btn light" onclick="hoModal.style.display='none'">Cancel</button> <button class="btn" id="hoOkBtn">Approve & Sync</button></div>
</div></div><script>
const OUTS=['Main Outlet','RestaurantPro - Andhra Pradesh','RestaurantPro - Arunachal Pradesh','RestaurantPro - Assam','RestaurantPro - Bihar','RestaurantPro - Chhattisgarh','RestaurantPro - Goa','RestaurantPro - Gujarat','RestaurantPro - Haryana','RestaurantPro - Himachal Pradesh','RestaurantPro - Jharkhand','RestaurantPro - Karnataka','RestaurantPro - Kerala','RestaurantPro - Madhya Pradesh','RestaurantPro - Maharashtra','RestaurantPro - Manipur','RestaurantPro - Meghalaya','RestaurantPro - Mizoram','RestaurantPro - Nagaland','RestaurantPro - Noida','RestaurantPro - Odisha','RestaurantPro - Punjab','RestaurantPro - Rajasthan','RestaurantPro - Sikkim','RestaurantPro - Tamil Nadu','RestaurantPro - Telangana','RestaurantPro - Tripura','RestaurantPro - Uttar Pradesh','RestaurantPro - Uttarakhand','RestaurantPro - West Bengal','RestaurantPro - Delhi'];
const cur=localStorage.getItem('rpSelectedOutlet')||'Main Outlet', isHO=cur==='Head Office';
outLbl.textContent=isHO?'Head Office Master':'Outlet: '+cur;
const getM=()=>{let l=JSON.parse(localStorage.getItem('rpMasterMenuItems')||'[]');if(!l.length){l=[{id:'m1',name:'5 Star Chocolate',price:40,shortCode:'234',barcode:'8905STAR234',cat1:'Retail',cat2:'Retail',cat3:'Self Creatable',vendor:'Arun Traders Vendor',selfCreate:true,selfUnit:'1 Pc',outlets:OUTS}];localStorage.setItem('rpMasterMenuItems',JSON.stringify(l));}return l;};
const getQ=()=>JSON.parse(localStorage.getItem('rpMenuApprovalQueue')||'[]');
function autoBar(){if(chkSelf.checked)fBar.value='890'+(fName.value||'ITEM').replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,6)+(fCode.value||'101');}
function togRec(){const s=fC3.value==='Self Creatable';chkSelf.checked=s;fUnit.style.display=s?'inline-block':'none';if(s)autoBar();}
function openForm(act,id=''){rAct.value=act;eId.value=id;if(id){const it=getM().find(x=>x.id===id);fTitle.textContent='Edit';fName.value=it.name;fPrice.value=it.price;fCode.value=it.shortCode;fBar.value=it.barcode;fC1.value=it.cat1;fC2.value=it.cat2;fC3.value=it.cat3;fVen.value=it.vendor;fUnit.value=it.selfUnit||'1 Pc';}else{fTitle.textContent='Add';mForm.reset();}togRec();fModal.style.display='flex';}
function delReq(id){const it=getM().find(x=>x.id===id);if(!it||!confirm('Send Delete to HO?'))return;const q=getQ();q.unshift({reqId:'REQ-'+Date.now(),action:'DELETE',targetId:id,item:it,reqBy:cur});localStorage.setItem('rpMenuApprovalQueue',JSON.stringify(q));render();}
mForm.onsubmit=e=>{e.preventDefault();if(chkSelf.checked&&!fBar.value)autoBar();const it={id:eId.value||('m-'+Date.now()),name:fName.value.trim(),price:Number(fPrice.value),shortCode:fCode.value.trim(),barcode:fBar.value.trim(),cat1:fC1.value,cat2:fC2.value,cat3:fC3.value,vendor:fVen.value,selfCreate:chkSelf.checked,selfUnit:fUnit.value,outlets:[cur]};const q=getQ();q.unshift({reqId:'REQ-'+Date.now(),action:rAct.value,targetId:it.id,item:it,reqBy:cur});localStorage.setItem('rpMenuApprovalQueue',JSON.stringify(q));fModal.style.display='none';render();alert('Sent to HO Approval!');};
function openHo(reqId){const r=getQ().find(x=>x.reqId===reqId);if(!r)return;hoInfo.innerHTML='<b>'+r.action+':</b> '+r.item.name;hoGrid.innerHTML=OUTS.map(o=>'<label style="font-size:12px"><input type="checkbox" class="hc" value="'+o+'" checked style="width:auto"> '+o+'</label>').join('');hoOkBtn.onclick=()=>{const q=getQ(),i=q.findIndex(x=>x.reqId===reqId),sel=Array.from(document.querySelectorAll('.hc:checked')).map(c=>c.value);let m=getM();if(r.action==='DELETE')m=m.filter(x=>x.id!==r.targetId);else{r.item.outlets=sel;const mi=m.findIndex(x=>x.id===r.targetId);if(mi>=0)m[mi]=r.item;else m.unshift(r.item);if(r.item.selfCreate)sel.forEach(o=>{const k='rpInventoryStock::'+o,st=JSON.parse(localStorage.getItem(k)||'{}');if(st[r.item.name]===undefined)st[r.item.name]=50;localStorage.setItem(k,JSON.stringify(st));});}localStorage.setItem('rpMasterMenuItems',JSON.stringify(m));q.splice(i,1);localStorage.setItem('rpMenuApprovalQueue',JSON.stringify(q));hoModal.style.display='none';render();};hoModal.style.display='flex';}
function render(){const q=getQ();apBody.innerHTML=q.map(r=>'<tr><td>'+r.reqId+'</td><td>'+r.action+'</td><td><b>'+r.item.name+'</b></td><td>'+r.item.cat1+'/'+r.item.cat2+'/'+r.item.cat3+'/'+r.item.vendor+'</td><td>'+r.item.barcode+'</td><td>'+r.reqBy+'</td><td>'+(isHO?'<button class="btn sm" onclick="openHo(''+r.reqId+'')">Approve</button>':'Pending HO')+'</td></tr>').join('')||'<tr><td colspan="7">No pending requests.</td></tr>';const l=getM().filter(it=>isHO||(it.outlets||[]).includes(cur));menuBody.innerHTML=l.map(it=>'<tr><td><b>'+it.name+'</b></td><td>'+it.cat1+'</td><td>'+it.cat2+'</td><td>'+it.cat3+'</td><td><b>'+it.vendor+'</b></td><td>'+it.shortCode+'</td><td><b>'+it.barcode+'</b></td><td>Rs.'+it.price+'</td><td>'+(it.selfCreate?'Self: -'+it.selfUnit:'Manual')+'</td><td><button class="btn light sm" onclick="alert('Barcode: '+it.barcode+'')">View</button> <button class="btn light sm" onclick="openForm('EDIT',''+it.id+'')">Edit</button> <button class="btn d sm" onclick="delReq(''+it.id+'')">Del</button></td></tr>').join('');}
render();
</script></body></html>

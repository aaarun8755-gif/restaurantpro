<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RestaurantPro | MIS Profit &amp; Loss Statement</title>
<style>
:root{--bg:#f4f7f6;--ink:#1e293b;--line:#cbd5e1;--teal:#0f766e;--dark:#115e59}
*{box-sizing:border-box;font-family:Cambria,Georgia,serif}
body{margin:0;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.wrap{max-width:1480px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;overflow-x:auto}
.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:13px}
.btn.light{background:#fff;color:#0f766e;border:1px solid var(--line)}
select,input[type="date"],input[type="month"]{padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th{background:#d9e8f5;color:#0f172a;padding:7px 9px;border:1px solid #94a3b8;text-align:center}
td{border:1px solid #cbd5e1;padding:6px 9px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.pct{text-align:right;color:#475569;font-size:11.5px;background:#f8fafc}
tr.sec-head td{background:#e2e8f0;font-weight:900;color:#0f172a}
tr.tot-row td{background:#eef6f4;font-weight:900;color:#115e59;border-top:2px solid #0f766e;border-bottom:2px solid #0f766e}
tr.sub-row td:nth-child(2){padding-left:24px;color:#334155}
input.m-inp{width:95px;padding:3px 5px;border:1px solid #cbd5e1;border-radius:4px;text-align:right;font-size:12.5px;font-weight:700}
@media print{.no-print{display:none!important}body{background:#fff}.card{border:0;padding:0}}
</style></head>
<body>
<header class="no-print">
  <div><strong style="font-size:18px;color:#115e59">&#128202; Outlet MIS Report (P&amp;L Statement ? Actual vs Budget)</strong> | <small id="roleSub" style="color:#64748b"></small></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" onclick="saveMisEdits()">Save MIS Changes &#10003;</button>
    <button class="btn light" onclick="exportMisExcel()">Export Excel</button>
    <button class="btn light" onclick="window.print()">Print / Save PDF</button>
    <a href="/index.html" class="btn light">&larr; Dashboard</a>
  </div>
</header>
<div class="wrap">
  <div class="card no-print" style="display:flex;gap:14px;align-items:end;flex-wrap:wrap">
    <div id="hoOutletWrap" style="display:none">
      <label style="font-size:11.5px;font-weight:700;display:block;margin-bottom:3px">Head Office ? Select Outlet *</label>
      <select id="misOutletSel" onchange="renderMis()" style="min-width:250px;font-weight:700"></select>
    </div>
    <div>
      <label style="font-size:11.5px;font-weight:700;display:block;margin-bottom:3px">Report Month *</label>
      <input type="month" id="misMonth" onchange="renderMis()">
    </div>
    <div>
      <label style="font-size:11.5px;font-weight:700;display:block;margin-bottom:3px">From Date</label>
      <input type="date" id="misFrom" onchange="renderMis()">
    </div>
    <div>
      <label style="font-size:11.5px;font-weight:700;display:block;margin-bottom:3px">To Date</label>
      <input type="date" id="misTo" onchange="renderMis()">
    </div>
  </div>

  <div class="card">
    <table style="margin-bottom:10px;max-width:520px">
      <tr><td style="background:#f8fafc;font-weight:700;width:160px">Name</td><td colspan="2"><b id="metaName">RestaurantPro Company Outlets</b></td></tr>
      <tr><td style="background:#f8fafc;font-weight:700">Location</td><td colspan="2"><b id="metaLoc">Main Outlet</b></td></tr>
      <tr><td style="background:#f8fafc;font-weight:700">Date of Opening</td><td colspan="2" id="metaOpen">07-Nov-23</td></tr>
    </table>

    <table>
      <thead>
        <tr>
          <th rowspan="2" style="width:55px">S. No.</th>
          <th rowspan="2" style="text-align:left;min-width:230px">Particulars</th>
          <th colspan="2" style="background:#bae6fd">Actual 24-25</th>
          <th colspan="2" style="background:#fecdd3">Actual 25-26</th>
          <th colspan="2" style="background:#bbf7d0">Actual 26-27 (Editable)</th>
          <th colspan="2" style="background:#fef08a">Budget 26-27</th>
          <th rowspan="2">Ach in %</th>
        </tr>
        <tr>
          <th>Amount</th><th>%</th>
          <th>Amount</th><th>%</th>
          <th>Amount</th><th>%</th>
          <th>Amount</th><th>%</th>
        </tr>
      </thead>
      <tbody id="misBody"></tbody>
    </table>
  </div>
</div>
<script>
const OUTLETS = ['Main Outlet','RestaurantPro - Andhra Pradesh','RestaurantPro - Arunachal Pradesh','RestaurantPro - Assam','RestaurantPro - Bihar','RestaurantPro - Chhattisgarh','RestaurantPro - Goa','RestaurantPro - Gujarat','RestaurantPro - Haryana','RestaurantPro - Himachal Pradesh','RestaurantPro - Jharkhand','RestaurantPro - Karnataka','RestaurantPro - Kerala','RestaurantPro - Madhya Pradesh','RestaurantPro - Maharashtra','RestaurantPro - Manipur','RestaurantPro - Meghalaya','RestaurantPro - Mizoram','RestaurantPro - Nagaland','RestaurantPro - Noida','RestaurantPro - Odisha','RestaurantPro - Punjab','RestaurantPro - Rajasthan','RestaurantPro - Sikkim','RestaurantPro - Tamil Nadu','RestaurantPro - Telangana','RestaurantPro - Tripura','RestaurantPro - Uttar Pradesh','RestaurantPro - Uttarakhand','RestaurantPro - West Bengal','RestaurantPro - Delhi'];
const loggedOut = localStorage.getItem('rpSelectedOutlet') || 'Main Outlet';
const isHO = loggedOut === 'Head Office';

misMonth.value = new Date().toISOString().slice(0,7);
const today = new Date().toISOString().slice(0,10);
misFrom.value = today.slice(0,8) + '01';
misTo.value = today;

if (isHO) {
  roleSub.textContent = 'Head Office Master Control (All 31 Outlets Filter Enabled)';
  hoOutletWrap.style.display = 'block';
  misOutletSel.innerHTML = '<option value="ALL_31">ALL 31 OUTLETS (CONSOLIDATED MASTER)</option>' + OUTLETS.map(o => '<option value="'+o+'">'+o+'</option>').join('');
} else {
  roleSub.textContent = 'Strict Outlet Access: ' + loggedOut;
}

const BASE_MIS = {
  s_rest: 4007054, s_sweet: 1702384, s_trad: 752682, s_cat: 0, s_hotel: 0, s_other: 0,
  rm_wast: 85689, rm_rest: 1538874, rm_sweet: 972926, rm_trad: 354679,
  pack_tot: 219933, gst_dis: 61043,
  fuel: 40005, manpower: 552434, clean: 48172, disc: 15146,
  elec: 384010, deliv: 112554, repair: 45544, shop: 19388, mkt: 155603, out_sal: 135537, admin: 23570,
  rent_fix: 0, rent_var: 441275, rent_stor: 0, rent_maint: 63039, rent_gst: 40695,
  corp_admin: 99571, interest: 0, dep: 79995
};

function getOutletMis(outName) {
  const key = 'rpMisSheet::' + outName + '::' + misMonth.value;
  const saved = JSON.parse(localStorage.getItem(key) || 'null');
  if (saved) return saved;
  const factor = outName === 'Main Outlet' ? 1 : (0.55 + (outName.length % 7) * 0.08);
  const obj = {};
  Object.keys(BASE_MIS).forEach(k => obj[k] = Math.round(BASE_MIS[k] * factor));
  return obj;
}

function getActiveData() {
  const target = isHO ? misOutletSel.value : loggedOut;
  if (target === 'ALL_31') {
    const sum = {}; Object.keys(BASE_MIS).forEach(k => sum[k] = 0);
    OUTLETS.forEach(o => { const d = getOutletMis(o); Object.keys(sum).forEach(k => sum[k] += Number(d[k]||0)); });
    return { target, editable: false, d: sum };
  }
  return { target, editable: true, d: getOutletMis(target) };
}

function saveMisEdits() {
  const { target, editable } = getActiveData();
  if (!editable) return alert('All-31 Consolidated view read-only hai. Edit karne ke liye koi ek outlet chunein.');
  const obj = getOutletMis(target);
  document.querySelectorAll('.m-inp').forEach(inp => { obj[inp.dataset.key] = Number(inp.value || 0); });
  localStorage.setItem('rpMisSheet::' + target + '::' + misMonth.value, JSON.stringify(obj));
  renderMis();
  alert('MIS Report Saved for ' + target + '!');
}

function fmt(n) { return Math.round(n).toLocaleString('en-IN'); }
function pct(part, gross) { return gross > 0 ? ((part / gross) * 100).toFixed(1) + '%' : '0.0%'; }

function renderMis() {
  const { target, editable, d } = getActiveData();
  metaLoc.textContent = target === 'ALL_31' ? 'All 31 Outlets (Consolidated)' : target.replace('RestaurantPro - ', '');

  // Exact Excel Formulas (S.No. 1 to 28)
  const grossSale = d.s_rest + d.s_sweet + d.s_trad + d.s_cat + d.s_hotel + d.s_other;
  const rawMat = d.rm_wast + d.rm_rest + d.rm_sweet + d.rm_trad;
  const totRmPm = rawMat + d.pack_tot + d.gst_dis;
  const totDirect = d.fuel + d.manpower + d.clean + d.disc;
  const grossProfit = grossSale - totRmPm - totDirect;
  const totOpExp = d.elec + d.deliv + d.repair + d.shop + d.mkt + d.out_sal + d.admin;
  const profBeforeRent = grossProfit - totOpExp;
  const totRent = d.rent_fix + d.rent_var + d.rent_stor + d.rent_maint + d.rent_gst;
  const ebitda = profBeforeRent - totRent - d.corp_admin;
  const profAfterInt = ebitda - d.interest;
  const netProf = profAfterInt - d.dep;
  const royalty = Math.round(grossSale * 0.05);
  const netAfterRoy = netProf - royalty;

  const rowsDef = [
    { sno:'1.1', name:'Restaurant', key:'s_rest', sub:true },
    { sno:'1.2', name:'Sweets', key:'s_sweet', sub:true },
    { sno:'1.3', name:'Trading', key:'s_trad', sub:true },
    { sno:'1.4', name:'Cat Indoor & Outdoor', key:'s_cat', sub:true },
    { sno:'1.5', name:'Hotel Service', key:'s_hotel', sub:true },
    { sno:'1.6', name:'Other Sales', key:'s_other', sub:true },
    { sno:'1', name:'Total Gross Sale', val:grossSale, tot:true },
    { sno:'2', name:'Raw Material (Total)', val:rawMat, sec:true },
    { sno:'', name:'Wastage', key:'rm_wast', sub:true },
    { sno:'', name:'Restaurant RM', key:'rm_rest', sub:true },
    { sno:'', name:'Sweets RM', key:'rm_sweet', sub:true },
    { sno:'', name:'Trading RM', key:'rm_trad', sub:true },
    { sno:'3', name:'Packing Material', key:'pack_tot' },
    { sno:'4', name:'GST Disallowance', key:'gst_dis' },
    { sno:'5', name:'Total RM & PM (2+3+4)', val:totRmPm, tot:true },
    { sno:'6', name:'Fuel Expenses', key:'fuel' },
    { sno:'7', name:'Total Manpower Cost', key:'manpower' },
    { sno:'8', name:'Cleaning & Consumable Exp.', key:'clean' },
    { sno:'9', name:'Trade Discount', key:'disc' },
    { sno:'9A', name:'Total Direct Operating Cost (6+7+8+9)', val:totDirect, tot:true },
    { sno:'10', name:'Gross Profit (1 - 5 - 9A)', val:grossProfit, tot:true },
    { sno:'11', name:'Electricity', key:'elec' },
    { sno:'12', name:'Delivery Expenses', key:'deliv' },
    { sno:'13', name:'Repair & Maint. & AMC', key:'repair' },
    { sno:'14', name:'Shop Expenses', key:'shop' },
    { sno:'15', name:'Marketing Expenses', key:'mkt' },
    { sno:'16', name:'Outlet Admin Salary', key:'out_sal' },
    { sno:'17', name:'Admin Expenses', key:'admin' },
    { sno:'18', name:'Total Expenses (11 to 17)', val:totOpExp, tot:true },
    { sno:'19', name:'Profit Before Rent (10 - 18)', val:profBeforeRent, tot:true },
    { sno:'20.1', name:'Rent (Fixed)', key:'rent_fix', sub:true },
    { sno:'20.2', name:'Rent (Variable)', key:'rent_var', sub:true },
    { sno:'20.3', name:'Storage Charges', key:'rent_stor', sub:true },
    { sno:'20.4', name:'Common Maintenance', key:'rent_maint', sub:true },
    { sno:'20.5', name:'GST Disallowance Exp.', key:'rent_gst', sub:true },
    { sno:'20', name:'Total Rent', val:totRent, tot:true },
    { sno:'21', name:'Corporate Admin Expenses', key:'corp_admin' },
    { sno:'22', name:'Operating Profit / EBITDA (19 - 20 - 21)', val:ebitda, tot:true },
    { sno:'23', name:'Interest Exp.', key:'interest' },
    { sno:'24', name:'Profit After Interest (22 - 23)', val:profAfterInt, tot:true },
    { sno:'25', name:'Depreciation', key:'dep' },
    { sno:'26', name:'Net Profit (24 - 25)', val:netProf, tot:true },
    { sno:'27', name:'Royalty @5%', val:royalty },
    { sno:'28', name:'Net Profit After Royalty (26 - 27)', val:netAfterRoy, tot:true }
  ];

  misBody.innerHTML = rowsDef.map(r => {
    const v26 = r.key ? Number(d[r.key]||0) : Number(r.val||0);
    const v24 = Math.round(v26 * 0.52);
    const v25 = Math.round(v26 * 0.76);
    const bud = Math.round(v26 * 1.04);
    const ach = bud > 0 ? ((v26 / bud) * 100).toFixed(1) + '%' : '100.0%';
    const cls = r.tot ? 'tot-row' : (r.sec ? 'sec-head' : (r.sub ? 'sub-row' : ''));
    const cell26 = (r.key && editable) ? '<input class="m-inp" data-key="'+r.key+'" type="number" value="'+v26+'">' : fmt(v26);
    return '<tr class="'+cls+'"><td style="text-align:center">'+r.sno+'</td><td>'+r.name+'</td>' +
      '<td class="num">'+fmt(v24)+'</td><td class="pct">'+pct(v24, Math.round(grossSale*0.52))+'</td>' +
      '<td class="num">'+fmt(v25)+'</td><td class="pct">'+pct(v25, Math.round(grossSale*0.76))+'</td>' +
      '<td class="num">'+cell26+'</td><td class="pct">'+pct(v26, grossSale)+'</td>' +
      '<td class="num">'+fmt(bud)+'</td><td class="pct">'+pct(bud, Math.round(grossSale*1.04))+'</td>' +
      '<td class="num"><b>'+ach+'</b></td></tr>';
  }).join('');
}

function exportMisExcel() {
  const rows = [['S.No','Particulars','Actual 24-25','Actual 25-26','Actual 26-27','Budget 26-27','Ach %']];
  document.querySelectorAll('#misBody tr').forEach(tr => {
    const tds = tr.querySelectorAll('td');
    const inp = tds?.querySelector('input');
    rows.push([tds.innerText, '"'+tds.innerText+'"', tds.innerText.replace(/,/g,''), tds.innerText.replace(/,/g,''), inp ? inp.value : tds.innerText.replace(/,/g,''), tds.innerText.replace(/,/g,''), tds.innerText]);
  });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')], {type:'text/csv'})); a.download = 'Outlet_MIS_PnL_Report.csv'; a.click();
}
renderMis();
</script></body></html>

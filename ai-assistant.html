<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RestaurantPro | Ask Me Anything AI</title>
<style>
*{box-sizing:border-box;font-family:Cambria,Georgia,serif}
body{margin:0;background:#f4f7f6;color:#1e293b;display:flex;flex-direction:column;height:100vh}
header{background:#fff;border-bottom:1px solid #dbe5e2;padding:12px 22px;display:flex;justify-content:space-between;align-items:center}
.chat{flex:1;max-width:960px;width:100%;margin:auto;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:12px 16px;border-radius:14px;font-size:14.5px;line-height:1.5;background:#fff;border:1px solid #dbe5e2}
.msg.u{background:#0f766e;color:#fff;align-self:flex-end;border:0}
.bar{background:#fff;border-top:1px solid #dbe5e2;padding:12px 16px;display:flex;gap:8px;justify-content:center}
input{flex:1;max-width:760px;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px}
button,a.btn{background:#0f766e;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:13px}
a.btn{background:#fff;color:#0f766e;border:1px solid #dbe5e2}
</style></head>
<body>
<header>
  <div><strong style="font-size:17px;color:#115e59">RestaurantPro AI Copilot</strong> | <small id="oLbl"></small></div>
  <a href="/index.html" class="btn">&larr; Dashboard</a>
</header>
<div class="chat" id="feed">
  <div class="msg"><b>Namaste!</b> Main aapke outlet ke live Sales, Stock, PO, Menu aur Tasks se juda hoon. Kuch bhi poochein (jaise: <i>Maida stock</i>, <i>Aaj ki sale</i>, <i>Pending PO</i>).</div>
</div>
<div class="bar">
  <input id="qBox" placeholder="Type your question here..." onkeydown="if(event.key==='Enter')askNow()">
  <button onclick="askNow()">Ask AI &rarr;</button>
</div>
<script>
const out = localStorage.getItem('rpSelectedOutlet') || 'Main Outlet';
oLbl.textContent = 'Outlet: ' + out;
function add(t, cls) { const d = document.createElement('div'); d.className = 'msg ' + (cls||''); d.innerHTML = t; feed.appendChild(d); feed.scrollTop = feed.scrollHeight; }
function askNow() {
  const q = qBox.value.trim(); if (!q) return; qBox.value = ''; add(q, 'u');
  const low = q.toLowerCase();
  const st = { 'Maida (kg)': 80, 'Khoya (kg)': 45, 'Desi Ghee (kg)': 32, 'Sugar (kg)': 60, 'Paneer (kg)': 25, ...JSON.parse(localStorage.getItem('rpInventoryStock::' + out) || '{}') };
  const bills = JSON.parse(localStorage.getItem('rpBills') || '[]').filter(b => out === 'Head Office' || !b.outlet || b.outlet === out);
  const pos = JSON.parse(localStorage.getItem('rpLockedPurchasePOs') || '[]').filter(p => out === 'Head Office' || p.outlet === out);
  const menu = JSON.parse(localStorage.getItem('rpMasterMenuItems') || '[]');

  if (low.includes('maida') || low.includes('mailda')) { add('<b>Maida Stock (' + out + '):</b> ' + (st['Maida (kg)'] ?? 80) + ' kg Available'); return; }
  if (low.includes('khoya')) { add('<b>Khoya Stock (' + out + '):</b> ' + (st['Khoya (kg)'] ?? 45) + ' kg Available'); return; }
  if (low.includes('ghee')) { add('<b>Desi Ghee Stock (' + out + '):</b> ' + (st['Desi Ghee (kg)'] ?? 32) + ' kg Available'); return; }
  if (low.includes('stock') || low.includes('inventory')) { add('<b>Live Stock (' + out + '):</b><br>' + Object.entries(st).map(([k,v]) => k + ': <b>' + v + '</b>').join('<br>')); return; }
  if (low.includes('sale') || low.includes('cash') || low.includes('order') || low.includes('bill')) {
    const tot = bills.reduce((s,x) => s + Number(x.total||0), 0);
    add('<b>Sales Summary (' + out + '):</b><br>Total Sales: <b>Rs. ' + tot.toFixed(2) + '</b> (' + bills.length + ' Bills)'); return;
  }
  if (low.includes('po') || low.includes('purchase')) { add('<b>Purchase Orders (' + out + '):</b> ' + pos.length + ' Audit-Locked POs'); return; }
  if (low.includes('menu') || low.includes('barcode')) { add('<b>Menu Master:</b> ' + menu.length + ' Approved Items'); return; }
  add('<b>' + out + ' Live Status:</b><br>Bills: <b>' + bills.length + '</b> | Tracked Stock Items: <b>' + Object.keys(st).length + '</b> | POs: <b>' + pos.length + '</b>');
}
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RestaurantPro | Customer Feedback &amp; Loyalty Rewards</title>
<style>
*{box-sizing:border-box;font-family:Cambria,Georgia,serif}
body{margin:0;background:#fffaf5;color:#1e293b;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#fff;border:1px solid #fed7aa;border-radius:16px;padding:24px;max-width:440px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.06);text-align:center}
.stars{display:flex;justify-content:center;gap:8px;margin:16px 0}
.star{font-size:32px;cursor:pointer;color:#cbd5e1;border:0;background:none;transition:.15s}
.star.active{color:#f59e0b;transform:scale(1.15)}
textarea,input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 12px;font-size:14px}
.btn{background:#0f766e;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px;width:100%;cursor:pointer}
</style></head>
<body>
<div class="card" id="fbBox">
  <div style="background:#d9261c;color:#fff;display:inline-block;padding:6px 14px;border-radius:8px;font-weight:900;font-size:16px;margin-bottom:8px">RESTAURANTPRO</div>
  <h2 style="margin:6px 0;color:#115e59">Rate Your Experience &amp; Claim Loyalty Points</h2>
  <p style="font-size:13.5px;color:#64748b" id="billMeta"></p>
  <div class="stars" id="starRow">
    <button type="button" class="star active" onclick="setStar(1)">&#9733;</button>
    <button type="button" class="star active" onclick="setStar(2)">&#9733;</button>
    <button type="button" class="star active" onclick="setStar(3)">&#9733;</button>
    <button type="button" class="star active" onclick="setStar(4)">&#9733;</button>
    <button type="button" class="star active" onclick="setStar(5)">&#9733;</button>
  </div>
  <input id="fName" placeholder="Your Name">
  <textarea id="fNote" rows="3" placeholder="How was the food quality, taste & service?"></textarea>
  <button class="btn" onclick="submitFb()">Submit Feedback &amp; Unlock 50 Loyalty Points</button>
</div>
<script>
const q = new URLSearchParams(location.search);
const bill = q.get('bill') || 'INV-1001';
const out = q.get('outlet') || 'RestaurantPro';
const nm = q.get('name') || '';
if (nm && nm !== 'Valued Guest') fName.value = nm;
billMeta.textContent = 'Bill #' + bill + ' | ' + out;
let rating = 5;
function setStar(n) {
  rating = n;
  document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < n));
}
function submitFb() {
  const list = JSON.parse(localStorage.getItem('rpCustFeedbacks') || '[]');
  list.unshift({ bill, outlet: out, name: fName.value.trim() || 'Guest', rating, note: fNote.value.trim() || 'Great experience!', date: new Date().toLocaleDateString('en-GB') });
  localStorage.setItem('rpCustFeedbacks', JSON.stringify(list));
  fbBox.innerHTML = '<div style="font-size:42px;color:#16a34a">&#10004;</div><h2 style="color:#115e59">Thank You for Your ' + rating + '-Star Rating!</h2><div style="background:#f0fdf4;border:1px dashed #16a34a;padding:14px;border-radius:12px;margin:14px 0"><strong style="color:#0f766e;font-size:16px">+50 Loyalty Points Credited!</strong><br><small>Use Coupon Code <b>LOYAL50</b> on your next visit for instant &#8377;50 Off.</small></div><a href="/website.html" style="display:inline-block;margin-top:8px;color:#ea580c;font-weight:700;text-decoration:none">Order Sweets &amp; Namkeen Online &rarr;</a>';
}
</script></body></html>

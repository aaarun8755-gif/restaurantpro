<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://w3.org%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2731%27 fill=%27%23b91c1c%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2724.5%27 fill=%27%23ffffff%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%23dc2626%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2711.5%27 fill=%27%231d4ed8%27/%3E%3Cpolygon points=%2732,21.5 34.8,29.2 43,29.2 36.4,34 38.9,41.8 32,37 25.1,41.8 27.6,34 21,29.2 29.2,29.2%27 fill=%27%23ffffff%27/%3E%3C/svg%3E">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RestaurantPro | Digital Table Menu</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#132a25;--muted:#5c726d;--line:#dbe5e2;--teal:#0f766e;--dark:#115e59}
*{box-sizing:border-box;font-family:Inter,'Segoe UI',Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:85px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:720px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef2f0}
.item:last-child{border-bottom:0}
.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer;font-size:13px}
.btn.light{background:#eef6f4;color:var(--teal);border:1px solid #cbe3dc}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-top:5px;font-size:13.5px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#115e59;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;z-index:20}
</style>
<style id="rpCambriaFont">
  *, body, input, select, textarea, button, table, th, td, h1, h2, h3, h4, p, span, div {
    font-family: Cambria, 'Times New Roman', Georgia, serif !important;
  }
</style>
<style id="rpSidebarSizeBoost">
  aside, nav, .side, #rpProdMgmtGroup, #rpLogiMgmtGroup, #rpMgmtSubMenu, #rpHoWebMenuBtn, #rpSwiggyNav, #rpZomatoNav, #rpWebNav {
    font-size: 14.5px !important;
  }
  aside *, nav *, .side *, #rpProdMgmtGroup *, #rpLogiMgmtGroup *, #rpMgmtSubMenu *, #rpHoWebMenuBtn *, #rpSwiggyNav *, #rpZomatoNav *, #rpWebNav * {
    font-size: 14.5px !important;
  }
</style>

<meta name="robots" content="noindex, nofollow">
</head>
<body>
<header>
  <div><strong style="font-size:17px;color:var(--dark)">? RestaurantPro Digital Menu</strong><br><small id="tblBadge" style="color:var(--teal);font-weight:700"></small></div>
  <span style="background:#e6f4f1;color:#115e59;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700">? Live Kitchen Order</span>
</header>
<div class="wrap">
  <div class="card">
    <input id="searchBox" placeholder="?? Search dish (e.g. Dosa, Paneer, Coffee)..." oninput="renderMenu()" style="margin:0">
  </div>
  <div class="card" id="menuList">Loading menu...</div>
  <div class="card">
    <label style="font-size:12.5px;font-weight:700">Customer Name <span style="color:#dc2626">*</span></label>
    <input id="custName" required placeholder="Enter your full name (Required)">
    <label style="font-size:12.5px;font-weight:700;display:block;margin-top:10px">Mobile Number <span style="color:#dc2626">*</span></label>
    <input id="custPhone" type="tel" maxlength="10" required placeholder="Enter 10-digit mobile number (Required)">
    <label style="font-size:12.5px;font-weight:700;display:block;margin-top:10px">Special Cooking Instructions</label>
    <textarea id="custNote" rows="2" placeholder="e.g. Less spicy, no onion..."></textarea>
    <label style="font-size:12.5px;font-weight:700;display:block;margin-top:10px">Payment Option</label>
    <select id="payMode"><option>Cash at Counter / Table</option><option>UPI / QR Scan</option><option>Card</option></select>
  </div>
</div>
<div class="bar">
  <div><small id="cartCount">0 Items</small><br><strong id="cartTotal" style="font-size:17px">?0.00</strong></div>
  <button class="btn" style="background:#fff;color:#115e59" onclick="placeOrder()">Place Order (Send to POS) ?</button>
</div>
<script>
const p = new URLSearchParams(location.search);
const tableId = p.get('tableId') || '';
const tableName = p.get('table') || 'Table 1';
const outletName = p.get('outlet') || 'Main Outlet';
tblBadge.textContent = tableName + ' ? ' + outletName;

let menu = [], cart = {};
async function loadMenu() {
  try {
    const r = await fetch('/api/menu?outlet=' + encodeURIComponent(outletName));
    if (r.ok) menu = await r.json();
  } catch(_) {}
  if (!menu.length) menu = [{id:'m1',name:'Masala Dosa',category:'South Indian',price:120},{id:'m2',name:'Idli Sambar',category:'South Indian',price:80},{id:'m3',name:'Paneer Butter Masala',category:'North Indian',price:240}];
  renderMenu();
}

function renderMenu() {
  const q = (searchBox.value || '').toLowerCase();
  const list = menu.filter(m => m.available !== false && (!q || m.name.toLowerCase().includes(q) || (m.category||'').toLowerCase().includes(q)));
  menuList.innerHTML = list.map(m => {
    const qty = cart[m.id] || 0;
    return '<div class="item"><div><strong>' + m.name + '</strong><br><small style="color:var(--muted)">' + (m.category||'Special') + ' ? ?' + m.price + '</small></div>' +
      (qty ? '<div style="display:flex;align-items:center;gap:8px"><button class="btn light" onclick="upd(\''+m.id+'\',-1)">?</button><strong>'+qty+'</strong><button class="btn" onclick="upd(\''+m.id+'\',1)">+</button></div>'
           : '<button class="btn light" onclick="upd(\''+m.id+'\',1)">+ Add</button>') + '</div>';
  }).join('') || '<p>No dishes found.</p>';
  let c = 0, sub = 0;
  Object.keys(cart).forEach(id => { const it = menu.find(x=>String(x.id)===String(id)); if(it && cart[id]>0){ c += cart[id]; sub += it.price * cart[id]; } });
  cartCount.textContent = c + ' Items';
  cartTotal.textContent = '?' + (sub * 1.05).toFixed(2) + ' (incl. 5% GST)';
}

function upd(id, d) { cart[id] = Math.max(0, (cart[id]||0) + d); if(!cart[id]) delete cart[id]; renderMenu(); }

async function placeOrder() {
  const items = Object.keys(cart).map(id => { const m = menu.find(x=>String(x.id)===String(id)); return m ? { itemId: m.id, name: m.name, qty: cart[id], price: m.price } : null; }).filter(Boolean);
  if (!items.length) return alert('Kripya pehle koi item add karein.');
  if (!custName.value.trim()) return alert('Kripya apna Naam (Customer Name) bharein.');
  if (!/^[0-9]{10}$/.test(custPhone.value.trim())) return alert('Kripya 10-digit Mobile Number bharein.');
  const total = items.reduce((s,i)=>s + i.price*i.qty, 0) * 1.05;
  const res = await fetch('/api/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: 'QR', tableId, tableName, outlet: outletName, customerName: custName.value.trim(), customerPhone: custPhone.value.trim(), customerNote: custNote.value, paymentMode: payMode.value, items, total: Number(total.toFixed(2)) })
  });
  if (res.ok) { cart = {}; renderMenu(); alert('? Order Received! Sent to POS Counter for Approval.'); }
  else alert('Order failed, please try again.');
}
loadMenu();
</script>
</body>
</html>

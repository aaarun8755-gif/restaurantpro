<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RestaurantPro | QR & Staff Access Hub</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#132a25;--muted:#5c726d;--line:#dbe5e2;--teal:#0f766e;--dark:#115e59;--soft:#eef6f4}
*{box-sizing:border-box;font-family:Inter,'Segoe UI',Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.wrap{max-width:1360px;margin:auto;padding:18px}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:5px 0 9px;font-size:13px}
.btn{border:0;border-radius:8px;padding:8px 13px;background:var(--teal);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;font-size:12px;display:inline-block}
.btn.light{background:#fff;color:var(--teal);border:1px solid var(--line)}.btn.d{background:#fee2e2;color:#b91c1c}
.btn.sm{padding:4px 8px;font-size:11px;margin:2px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.qcard img{width:145px;height:145px;margin:8px auto;display:block;border:1px solid #eef2f0;border-radius:8px;padding:4px}
.urow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f1f5f4;font-size:12.5px}
@media(max-width:950px){.top3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><strong style="font-size:18px;color:var(--dark)">✦ RestaurantPro QR &amp; Mobile Apps Hub</strong><br><small id="netInfo" style="color:var(--muted)"></small></div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <select id="outlet" onchange="loadAll()" style="width:auto;margin:0"><option>Main Outlet</option><option>RestaurantPro - Andhra Pradesh</option><option>RestaurantPro - Arunachal Pradesh</option><option>Head Office</option></select>
    <a href="/index.html" class="btn light">← Dashboard</a>
  </div>
</header>
<div class="wrap">
  <div class="top3">
    <div class="card">
      <h3 style="margin-top:0">1. Create Table QR</h3>
      <form id="tf"><input id="tname" required placeholder="Table Name (e.g. Table 1, T2)"><button class="btn" style="width:100%">+ Create Table</button></form>
      <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn light" id="sbtn" onclick="syncMenu()">↻ Sync Menu to QR</button>
        <span id="m2" style="font-size:12px;color:var(--teal);font-weight:700;align-self:center"></span>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">2. Create Captain / Waiter Login</h3>
      <form id="uf"><input id="uname" required placeholder="Staff Name"><input id="uphone" required placeholder="Mobile Number"><input id="upw" required placeholder="Password"><button class="btn" style="width:100%">+ Create Captain User</button></form>
      <div id="ulist" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">3. Create POS Login (4-Digit PIN)</h3>
      <form id="pf"><input id="pname" required placeholder="Cashier Name"><input id="pphone" required placeholder="Mobile Number"><input id="ppw" required maxlength="4" placeholder="4-Digit PIN (1234)"><button class="btn" style="width:100%">+ Create POS User</button></form>
      <div id="plist" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between">
    <div><strong>📱 Live Mobile App Links (Permanent URL):</strong> <small id="liveBase" style="color:var(--teal);font-weight:700"></small></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a href="/captain.html" target="_blank" class="btn">Captain App ↗</a>
      <button class="btn light" onclick="copyPath('/captain.html')">Copy Captain Link</button>
      <a href="/kds.html" target="_blank" class="btn">KDS Only ↗</a>
      <button class="btn light" onclick="copyPath('/kds.html')">Copy KDS Link</button>
      <a href="/cashier-pos.html" target="_blank" class="btn">POS Only (PIN) ↗</a>
      <button class="btn light" onclick="copyPath('/cashier-pos.html')">Copy POS Link</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Table QR Codes (Scan with Any Mobile Camera)</h3>
    <div class="qgrid" id="qgrid"></div>
  </div>
</div>
<script>
const ORIGIN = window.location.origin;
netInfo.textContent = '● Live Permanent Server: ' + ORIGIN;
liveBase.textContent = ORIGIN;
const selOut = localStorage.getItem('rpSelectedOutlet');
if (selOut && Array.from(outlet.options).some(o=>o.value===selOut)) outlet.value = selOut;

function copyPath(p) { navigator.clipboard.writeText(ORIGIN + p); alert('Copied Permanent Link:\n' + ORIGIN + p); }
function qStr() { return '?outlet=' + encodeURIComponent(outlet.value); }

async function loadAll() {
  const tables = await (await fetch('/api/tables' + qStr())).json();
  qgrid.innerHTML = tables.map(t => {
    const custUrl = `${ORIGIN}/customer.html?table=${encodeURIComponent(t.name)}&outlet=${encodeURIComponent(t.outlet)}`;
    const qrImg = `/api/qr-image?text=${encodeURIComponent(custUrl)}`;
    return `<div class="qcard">
      <strong style="font-size:15px">${t.name}</strong><br><small style="color:var(--muted)">${t.outlet}</small>
      <img src="${qrImg}" alt="QR">
      <div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap">
        <a href="${custUrl}" target="_blank" class="btn sm">Open Menu</a>
        <button class="btn light sm" onclick="editT('${t.id}','${t.name}')">Edit</button>
        <button class="btn d sm" onclick="delT('${t.id}')">Del</button>
      </div>
    </div>`;
  }).join('') || '<p>No tables yet. Create a table above.</p>';

  const staff = await (await fetch('/api/staff-users' + qStr())).json();
  ulist.innerHTML = staff.map(u => `<div class="urow"><span><b>${u.name}</b> (${u.phone})</span><button class="btn d sm" onclick="delU('${u.id}')">Del</button></div>`).join('');

  const posU = await (await fetch('/api/pos-users' + qStr())).json();
  plist.innerHTML = posU.map(u => `<div class="urow"><span><b>${u.name}</b> (PIN: ${u.password})</span><button class="btn d sm" onclick="delP('${u.id}')">Del</button></div>`).join('');
}

tf.onsubmit = async e => { e.preventDefault(); await fetch('/api/tables',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({outlet:outlet.value,name:tname.value})}); tname.value=''; loadAll(); };
async function editT(id, old){ const name=prompt('New Table Name:', old); if(name){ await fetch('/api/tables/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); loadAll(); } }
async function delT(id){ if(confirm('Delete Table?')){ await fetch('/api/tables/'+id,{method:'DELETE'}); loadAll(); } }

uf.onsubmit = async e => { e.preventDefault(); await fetch('/api/staff-users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({outlet:outlet.value,name:uname.value,phone:uphone.value,password:upw.value})}); uname.value=''; uphone.value=''; upw.value=''; loadAll(); };
async function delU(id){ await fetch('/api/staff-users/'+id,{method:'DELETE'}); loadAll(); }

pf.onsubmit = async e => { e.preventDefault(); const r=await fetch('/api/pos-users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({outlet:outlet.value,name:pname.value,phone:pphone.value,password:ppw.value})}); if(!r.ok) return alert('4-digit PIN required'); pname.value=''; pphone.value=''; ppw.value=''; loadAll(); };
async function delP(id){ await fetch('/api/pos-users/'+id,{method:'DELETE'}); loadAll(); }

async function syncMenu() {
  let items = JSON.parse(localStorage.getItem('rpMenuItems') || '[]');
  if (!items.length) items = [{id:1,name:'Masala Dosa',category:'South Indian',price:120},{id:2,name:'Paneer Butter Masala',category:'North Indian',price:240},{id:3,name:'Veg Burger',category:'Fast Food',price:99}];
  const d = await (await fetch('/api/menu/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({outlet:outlet.value,items})})).json();
  m2.textContent = `✓ ${d.count} items synced!`;
}
loadAll();
</script>
</body>
</html>
